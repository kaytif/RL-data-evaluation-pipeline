services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: acceptance
      POSTGRES_DB: acceptance
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
